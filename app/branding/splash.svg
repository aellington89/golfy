<?xml version="1.0" encoding="UTF-8"?>
<!--
  Golfy PRE-ANDROID-12 splash mark: the foreground layer on a fairway-green
  circle, which is how Android 12+ draws its own splash from
  icon_foreground.png and icon_background_color. Both generations show the
  same thing.

  Android 12+ shows its 240dp splash icon through a 160dp circle, so the
  circle is two thirds of the 1024 canvas: radius 341 around (512, 512),
  cropped to that circle (viewBox 171..853). The foreground's 313 safe zone
  sits inside it. Exported at 640 px, which flutter_native_splash treats as
  xxxhdpi, so 160dp. The shapes are a straight copy of icon_foreground.svg;
  keep them in step. See README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="171 171 682 682">
  <circle cx="512" cy="512" r="341" fill="#2E7D32"/>
  <ellipse cx="512" cy="700" rx="230" ry="60" fill="#66BB6A"/>
  <ellipse cx="388" cy="730" rx="34" ry="9" fill="#388E3C"/>
  <circle cx="380" cy="700" r="34" fill="#FFFFFF"/>
  <ellipse cx="500" cy="706" rx="40" ry="13" fill="#1B3A1E"/>
  <rect x="484" y="230" width="32" height="478" rx="8" fill="#FFFFFF"/>
  <path d="M516,236 C600,262 690,296 760,330 C690,364 600,398 516,424 Z" fill="#FBC02D"/>
</svg>
