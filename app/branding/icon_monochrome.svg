<?xml version="1.0" encoding="UTF-8"?>
<!--
  Golfy adaptive-icon MONOCHROME layer (Android 13+ themed icons). Android
  uses only the alpha channel and tints it, so this is one solid colour: the
  foreground's silhouette, with the ball and the cup cut out of the green so
  they still read once everything is the same colour. Same safe zone as
  icon_foreground.svg. See README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Green, minus a ring around the ball and minus the cup (even-odd holes). -->
  <path fill="#000000" fill-rule="evenodd" d="
    M282,700 A230,60 0 1,0 742,700 A230,60 0 1,0 282,700 Z
    M334,700 A46,46 0 1,0 426,700 A46,46 0 1,0 334,700 Z
    M460,706 A40,13 0 1,0 540,706 A40,13 0 1,0 460,706 Z"/>
  <circle cx="380" cy="700" r="34" fill="#000000"/>
  <rect x="484" y="230" width="32" height="478" rx="8" fill="#000000"/>
  <path d="M516,236 C600,262 690,296 760,330 C690,364 600,398 516,424 Z" fill="#000000"/>
</svg>
