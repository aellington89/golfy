<?xml version="1.0" encoding="UTF-8"?>
<!--
  Golfy adaptive-icon FOREGROUND layer: a putting green with the flag in the
  cup and a ball on the green. Transparent everywhere else.

  Everything stays inside the adaptive safe zone, a circle of 66dp on the
  108dp canvas: radius 313 around (512, 512) at this 1024 scale. The flag tip
  (760, 330) is the closest point, at about 308. See README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Putting green. -->
  <ellipse cx="512" cy="700" rx="230" ry="60" fill="#66BB6A"/>
  <!-- Ball, with its shadow on the green. -->
  <ellipse cx="388" cy="730" rx="34" ry="9" fill="#388E3C"/>
  <circle cx="380" cy="700" r="34" fill="#FFFFFF"/>
  <!-- Cup. -->
  <ellipse cx="500" cy="706" rx="40" ry="13" fill="#1B3A1E"/>
  <!-- Flagstick, standing in the cup. -->
  <rect x="484" y="230" width="32" height="478" rx="8" fill="#FFFFFF"/>
  <!-- Pennant, in flag yellow. -->
  <path d="M516,236 C600,262 690,296 760,330 C690,364 600,398 516,424 Z" fill="#FBC02D"/>
</svg>
