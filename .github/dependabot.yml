# .github/dependabot.yml
#
# Dependency updates land on the standing `deps/patch` integration branch
# rather than on master. Dependabot opens its PRs there, `flutter-build.yml`
# analyzes/tests/builds each one, and the accumulated batch is merged up to
# master when a patch release is cut — so a dependency bump never lands
# untested next to feature work, and one merge (not one per package) moves
# them all.
#
# Two things about `target-branch` are easy to get wrong:
#
#   1. Dependabot reads THIS file from the *default* branch (master) even
#      though every PR it opens is based on `deps/patch`. Edits to this config
#      only take effect once they are merged to master.
#   2. `target-branch` governs *version* updates only. Dependabot **security**
#      updates ignore this configuration entirely and always open against the
#      default branch — which is what you want for a CVE, since a fix should
#      not sit in an integration branch waiting for a release.
#
# `deps/patch` must already exist, or Dependabot fails the config check.

version: 2

updates:
  # ─── GitHub Actions ────────────────────────────────────────────────────────
  # Covers flutter-build.yml and release.yml: actions/checkout, setup-java,
  # upload-artifact, subosito/flutter-action, softprops/action-gh-release.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: deps/patch
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5
    groups:
      # These are all pinned to major tags (`@v4`), so a patch/minor bump is a
      # tag re-point and safe to batch into one PR. Majors deliberately fall
      # outside this group and get their own: upload-artifact v3 -> v4 changed
      # artifact semantics, and that deserves to be read on its own.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ─── Dart / Flutter packages ──────────────────────────────────────────────
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: deps/patch
    labels:
      - dependencies
      - dart
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    open-pull-requests-limit: 5
    cooldown:
      # Sit on a new release for three days so a broken pub.dev publish has a
      # chance to be yanked before it reaches a PR here.
      default-days: 3
    groups:
      # drift and drift_dev share a version line, and the committed `*.g.dart`
      # files are generated by the pair. Bumping one without the other means
      # CI builds against generated code from a different drift version, so
      # they must move in a single PR. A merged drift bump still needs a local
      # `build_runner` pass if the generated output changes.
      #
      # Grouping gets them into one PR but does not guarantee all three
      # constraints are rewritten. In #111 Dependabot moved drift to ^2.35.0
      # and drift_flutter to ^0.3.1, updated the lock for all three, and
      # reported drift_dev as updated in the commit message — but left
      # drift_dev declared at ^2.33.0. The caret still admitted 2.35.0, so
      # nothing failed and it went unnoticed. Read the pubspec diff of a drift
      # PR, not just its description; `app/test/tool/drift_trio_test.dart`
      # fails if the three diverge.
      drift:
        patterns:
          - drift
          - drift_dev
          - drift_flutter
      pub:
        patterns:
          - "*"
        exclude-patterns:
          - drift
          - drift_dev
          - drift_flutter
        update-types:
          - minor
          - patch

  # ─── Android / Gradle ─────────────────────────────────────────────────────
  # The Android Gradle Plugin and the Kotlin plugin declared in
  # app/android/settings.gradle.kts are coupled to the Flutter SDK pinned in
  # the workflows (3.47.6). A green CI run does not prove the combination is
  # one Flutter supports, so these are monthly, grouped, and worth reading
  # against the Flutter release notes before merging — usually alongside a
  # Flutter upgrade rather than ahead of one.
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: monthly
    target-branch: deps/patch
    labels:
      - dependencies
      - android
    commit-message:
      prefix: "android(deps)"
    open-pull-requests-limit: 3
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
