# .github/dependabot.yml
#
# Dependency updates follow the shared dev process (docs/PROCESS.md, Upgrades): Dependabot opens
# its pull requests against master, titled "Upgrade: bump …", and flutter-build.yml analyzes,
# tests, and builds each one. Its last job merges the low-risk ones once everything passes:
# development dependencies' patch and minor updates, and non-major GitHub Actions updates. The
# rest wait for a person: production packages, the drift group, the Gradle group, and every
# major.
#
# Dependabot security updates arrive the same way, against master.

version: 2

updates:
  # ─── GitHub Actions ────────────────────────────────────────────────────────
  # Covers every workflow: actions/checkout, setup-java, upload-artifact,
  # subosito/flutter-action, softprops/action-gh-release, and the dev process's.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - 'type: upgrade'
      - github-actions
    commit-message:
      prefix: Upgrade
    open-pull-requests-limit: 5
    groups:
      # These are pinned to major tags (`@v4`), so a patch/minor bump is a
      # tag re-point and safe to batch into one PR. Majors deliberately fall
      # outside this group and get their own: upload-artifact v3 -> v4 changed
      # artifact semantics, and that deserves to be read on its own.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ─── Dart / Flutter packages ──────────────────────────────────────────────
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - 'type: upgrade'
      - dart
    commit-message:
      prefix: Upgrade
    open-pull-requests-limit: 5
    cooldown:
      # Sit on a new release for three days so a broken pub.dev publish has a
      # chance to be yanked before it reaches a PR here.
      default-days: 3
    groups:
      # drift and drift_dev share a version line, and the committed `*.g.dart`
      # files are generated by the pair. Bumping one without the other means
      # CI builds against generated code from a different drift version, so
      # they must move in a single PR, and CI never merges this group by
      # itself: a merged drift bump still needs a local `build_runner` pass if
      # the generated output changes.
      #
      # Grouping gets them into one PR but does not guarantee all three
      # constraints are rewritten. In #111 Dependabot moved drift to ^2.35.0
      # and drift_flutter to ^0.3.1, updated the lock for all three, and
      # reported drift_dev as updated in the commit message — but left
      # drift_dev declared at ^2.33.0. The caret still admitted 2.35.0, so
      # nothing failed and it went unnoticed. Read the pubspec diff of a drift
      # PR, not just its description; `app/test/tool/drift_trio_test.dart`
      # fails if the three diverge.
      drift:
        patterns:
          - drift
          - drift_dev
          - drift_flutter
      pub:
        patterns:
          - "*"
        exclude-patterns:
          - drift
          - drift_dev
          - drift_flutter
        update-types:
          - minor
          - patch

  # ─── Android / Gradle ─────────────────────────────────────────────────────
  # The Android Gradle Plugin and the Kotlin plugin declared in
  # app/android/settings.gradle.kts are coupled to the Flutter SDK pinned in
  # the workflows (3.47.6). A green CI run does not prove the combination is
  # one Flutter supports, so these are monthly, grouped, never merged by CI,
  # and worth reading against the Flutter release notes before merging —
  # usually alongside a Flutter upgrade rather than ahead of one.
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: monthly
    labels:
      - dependencies
      - 'type: upgrade'
      - android
    commit-message:
      prefix: Upgrade
    open-pull-requests-limit: 3
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
